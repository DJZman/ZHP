<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Film Factory Admin</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background:#0b0b0c; color:#e7e7e7 }
      header { padding: 16px 20px; background:#121214; border-bottom:1px solid #222 }
      h1 { margin:0; font-size:18px }
      .container { display:flex; gap:20px; padding:20px }
      .panel { background:#141416; border:1px solid #232326; border-radius:12px; padding:16px; flex:1 }
      input, textarea, button, select { background:#0f0f10; color:#e7e7e7; border:1px solid #2a2a2e; border-radius:8px; padding:8px }
      button { cursor:pointer }
      .row { display:flex; gap:8px; align-items:center }
      .list { display:flex; flex-direction:column; gap:8px; max-height:60vh; overflow:auto }
      .item { padding:10px; border:1px solid #232326; border-radius:10px; background:#0f0f10 }
      .muted { color:#a0a0a0; font-size:12px }
      label { font-size:12px; color:#a0a0a0 }
      .grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px }
    </style>
  </head>
  <body>
    <header><h1>AI Film Factory — Admin</h1></header>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
